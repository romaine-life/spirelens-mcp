name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  whitespace:
    runs-on: [ubuntu-latest, upstairspc-linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      # The game assemblies are proprietary; folder mode checks the C# syntax
      # without loading the game-dependent project.
      - run: dotnet format whitespace . --folder --verify-no-changes --verbosity diagnostic

  pytest:
    runs-on: [ubuntu-latest, upstairspc-linux]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"
      - run: uv run --frozen --group dev pytest -q
