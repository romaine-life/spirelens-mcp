name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/check-fetches@main

  whitespace:
    runs-on: [ubuntu-latest, upstairspc-linux]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/home-cache@main
      - uses: romaine-life/pipeline-templates/actions/setup-dotnet@main
        with:
          dotnet-version: "9.0"
      # The game assemblies are proprietary; folder mode checks the C# syntax
      # without loading the game-dependent project.
      - run: dotnet format whitespace . --folder --verify-no-changes --verbosity diagnostic

  pytest:
    runs-on: [ubuntu-latest, upstairspc-linux]
    defaults:
      run:
        shell: bash
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: romaine-life/pipeline-templates/actions/setup-uv@main
        with:
          enable-cache: true
          cache-dependency-glob: "mcp/uv.lock"
      - run: uv run --frozen --group dev pytest -q
